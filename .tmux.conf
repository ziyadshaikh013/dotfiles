set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tpm'

# Truecolor (24-bit) passthrough so carbonfox renders its full palette instead
# of tmux snapping every syntax color to the nearest 256-color slot. Without
# this, comments/strings/keywords muddy into lookalikes. Needs a truecolor
# client terminal; if colors look wrong, the client is 256-only — revert.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Set the control character to Ctrl+Spacebar (instead of Ctrl+B)
set -g prefix C-b
bind-key C-b send-prefix

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Index Start
set -g base-index 1

# Options to make tmux more pleasant
set -g mouse on

# Enable clipboard integration
set -g set-clipboard on

# Dracula config
set -g @dracula-show-left-icon "#H:#S"
set -g @dracula-force-gpu "NVIDIA"
set -g @dracula-gpu-vram-percent true
set -g @dracula-plugins "cpu-usage gpu-usage ram-usage"
set -g @dracula-show-flags true
set -g @dracula-show-edge-icons true
set -g @dracula-border-contrast true
set -g window-status-separator ''

set -g renumber-windows on

# Moving between panes with vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm' 
